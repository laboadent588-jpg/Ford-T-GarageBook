name: Deploy Model T Garage Book to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static app
        run: |
          mkdir -p _site
          cp index.html styles.css app.js offline-library.js manifest.webmanifest icon.svg icon-192.png icon-512.png sw.js model-t-torpedo-ad.png _site/
          cp -R documents _site/documents
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
